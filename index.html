<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic FFT Spectrogram</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; width: 512px; height: 512px; }
    </style>
</head>
<body>
    <canvas id="glCanvas" width="512" height="512" style="position: absolute; top: 0; left: 0;"></canvas>
    <script id="vertexShader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        varying vec2 v_texcoord;
        
        void main() {
            v_texcoord = a_position * 0.5 + 0.5;
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 v_texcoord;
        uniform sampler2D u_spectrogram;
        
        void main() {
            float intensity = texture2D(u_spectrogram, vec2(v_texcoord.x, v_texcoord.y)).r ;
            gl_FragColor = vec4(intensity, intensity, intensity, 1.0);
        }
    </script>
    <script>
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl');

        // Resize canvas to fit the screen
        function resizeCanvas() {
            canvas.width = 512;
            canvas.height = 512;
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Setup WebGL Shader Program
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Error compiling shader', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Error linking program', gl.getProgramInfoLog(program));
                gl.deleteProgram(program);
                return null;
            }
            return program;
        }

        const vertexShaderSource = document.getElementById('vertexShader').text;
        const fragmentShaderSource = document.getElementById('fragmentShader').text;

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        const program = createProgram(gl, vertexShader, fragmentShader);
                gl.useProgram(program);

        // Setup a_position attribute
        const aPositionLocation = gl.getAttribLocation(program, 'a_position');
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(aPositionLocation);
        gl.vertexAttribPointer(aPositionLocation, 2, gl.FLOAT, false, 0, 0);

        // Set up spectrogram texture
        const spectrogramTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, spectrogramTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        // Audio setup
        async function setupAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);

            const frequencyData = new Float32Array(analyser.frequencyBinCount);
            const dataTextureArray = new Uint8Array(frequencyData.length * canvas.width * 4);
            const historyWidth = canvas.width;
            let offset = 0;

            function updateSpectrogram() {
                analyser.getFloatFrequencyData(frequencyData.subarray(0, analyser.frequencyBinCount));
                // Scroll left by 1 pixel and add new data on the right
                offset = (offset + 1) % historyWidth;
                for (let i = 0; i < analyser.frequencyBinCount; i++) {
                    for (let j = 0; j < historyWidth - 1; j++) {
                        dataTextureArray[(i * historyWidth + j) * 4] = dataTextureArray[(i * historyWidth + j + 1) * 4];
                        dataTextureArray[(i * historyWidth + j) * 4 + 1] = dataTextureArray[(i * historyWidth + j + 1) * 4 + 1];
                        dataTextureArray[(i * historyWidth + j) * 4 + 2] = dataTextureArray[(i * historyWidth + j + 1) * 4 + 2];
                        dataTextureArray[(i * historyWidth + j) * 4 + 3] = 1.0;
                    }
                    dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4] = Math.min(255, Math.max(0, frequencyData[i] * 255));
                    dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4 + 1] = dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4];
                    dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4 + 2] = dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4];
                    dataTextureArray[(i * historyWidth + (historyWidth - 1)) * 4 + 3] = 1.0;
                }
                gl.bindTexture(gl.TEXTURE_2D, spectrogramTexture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, frequencyData.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, dataTextureArray);
                gl.uniform1i(gl.getUniformLocation(program, 'u_spectrogram'), 0);
            }

            function render() {
                            updateSpectrogram();
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render();
        }

        setupAudio().catch(console.error);
    </script>
    <label for="pixelSlider" style="position: absolute; top: 520px; left: 10px; color: black; background-color: rgba(255, 255, 255, 0.7); padding: 2px; border-radius: 3px;">Time Scale:</label>
    <input type="range" id="pixelSlider" min="1" max="10" value="1" style="position: absolute; top: 540px; left: 10px;">
    <span id="pixelValue" style="position: absolute; top: 540px; left: 180px; color: white;">1</span>
    <script>
        const pixelSlider = document.getElementById('pixelSlider');
        let pixelStep = parseInt(pixelSlider.value);
        pixelSlider.addEventListener('input', (event) => {
            pixelStep = parseInt(event.target.value);
            document.getElementById('pixelValue').textContent = event.target.value;
        });

        async function setupAudio() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);

            const frequencyData = new Uint8Array(analyser.frequencyBinCount);
            const dataTextureArray = new Uint8Array(frequencyData.length * canvas.width * 4);
            const historyWidth = canvas.width;
            let offset = 0;

            function updateSpectrogram() {
                analyser.getByteFrequencyData(frequencyData.subarray(0, analyser.frequencyBinCount));
                // Scroll left by pixelStep pixels and add new data on the right
                offset = (offset + pixelStep) % historyWidth;
                for (let i = 0; i < analyser.frequencyBinCount; i++) {
                    for (let j = 0; j < historyWidth - pixelStep; j++) {
                        dataTextureArray[(i * historyWidth + j) * 4] = dataTextureArray[(i * historyWidth + j + pixelStep) * 4];
                        dataTextureArray[(i * historyWidth + j) * 4 + 1] = dataTextureArray[(i * historyWidth + j + pixelStep) * 4 + 1];
                        dataTextureArray[(i * historyWidth + j) * 4 + 2] = dataTextureArray[(i * historyWidth + j + pixelStep) * 4 + 2];
                        dataTextureArray[(i * historyWidth + j) * 4 + 3] = 1.0;
                    }
                    for (let j = historyWidth - pixelStep; j < historyWidth; j++) {
                        dataTextureArray[(i * historyWidth + j) * 4] = frequencyData[i];
                        dataTextureArray[(i * historyWidth + j) * 4 + 1] = frequencyData[i];
                        dataTextureArray[(i * historyWidth + j) * 4 + 2] = 0.0;
                        dataTextureArray[(i * historyWidth + j) * 4 + 3] = 1.0;
                    }
                }
                gl.bindTexture(gl.TEXTURE_2D, spectrogramTexture);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, canvas.width, frequencyData.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, dataTextureArray);
                gl.uniform1i(gl.getUniformLocation(program, 'u_spectrogram'), 0);
            }

            function render() {
                updateSpectrogram();
                gl.clear(gl.COLOR_BUFFER_BIT);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render();
        }

        setupAudio().catch(console.error);
    </script>
    
    
</body>
</html>
